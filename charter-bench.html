<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Charter Bench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..800&family=JetBrains+Mono:wght@500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..600;1,8..60,400&display=swap">
<style>
/* Layout: a statute book. Section numbers sit in a margin column like the Charter's own margin notes; the
   app chrome is a court docket bar. Scarlet comes from Supreme Court robes, gold from the XP "seal". */
:root{
  --paper:#F3F5F8; --sheet:#FFFFFF; --sheet-2:#F8F9FB; --ink:#141D33; --muted:#59627A; --rule:#DAE0E9;
  --robe:#A41D26; --robe-ink:#FFFFFF; --robe-soft:#F7E4E5;
  --gold:#9A6B00; --gold-soft:#FBF0D3; --seal:#C8A24A;
  --ok:#17744A; --ok-soft:#DFF2E8; --bad:#B42318; --bad-soft:#FCE6E3; --focus:#2C59D0;
  --f-ui:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-text:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0C111D; --sheet:#141B2B; --sheet-2:#192236; --ink:#E7EAF2; --muted:#9BA4BA; --rule:#28324A;
  --robe:#EE5D66; --robe-ink:#1A0508; --robe-soft:#3A161C; --gold:#E6B84A; --gold-soft:#2F260F; --seal:#E6B84A;
  --ok:#4CC38A; --ok-soft:#10301F; --bad:#FF7B6E; --bad-soft:#3B1613; --focus:#7EA2FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0C111D; --sheet:#141B2B; --sheet-2:#192236; --ink:#E7EAF2; --muted:#9BA4BA; --rule:#28324A;
  --robe:#EE5D66; --robe-ink:#1A0508; --robe-soft:#3A161C; --gold:#E6B84A; --gold-soft:#2F260F; --seal:#E6B84A;
  --ok:#4CC38A; --ok-soft:#10301F; --bad:#FF7B6E; --bad-soft:#3B1613; --focus:#7EA2FF; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-stretch:82%;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,5vw,44px);font-weight:800}
h2{font-size:clamp(22px,3.4vw,30px);font-weight:800}
h3{font-size:18px;font-weight:700}
p{margin:0}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.serif{font-family:var(--f-text)}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--paper)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-stretch:75%;font-size:20px;letter-spacing:.01em;text-decoration:none;color:inherit}
.brand svg{flex:none}
.stats{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:13px;flex-wrap:wrap}
.stat b{font-family:var(--f-mono);font-weight:700}
.xpbar{width:120px;height:6px;border-radius:3px;background:rgba(127,127,127,.3);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--seal);width:0;transition:width .4s}
.lvl{color:var(--seal);font-weight:700}
.nav{background:var(--sheet);border-bottom:1px solid var(--rule)}
.nav .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav a{padding:12px 12px 10px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap;border-bottom:3px solid transparent}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--robe)}
main{padding-block:28px 64px}
.view{display:grid;gap:22px}

/* generic */
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:20px;min-width:0}
.grid{display:grid;gap:14px}
.grid>*{min-width:0}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:9px 14px;font-weight:650;cursor:pointer;transition:transform .08s,background .15s}
.btn:hover{background:var(--sheet-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--robe);border-color:var(--robe);color:var(--robe-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tag{display:inline-block;font-family:var(--f-mono);font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--robe-soft);color:var(--robe);white-space:nowrap}
.tag.gold{background:var(--gold-soft);color:var(--gold)}
.tag.plain{background:var(--sheet-2);color:var(--muted);border:1px solid var(--rule)}
.tag.okt{background:var(--ok-soft);color:var(--ok)}
a.tag{text-decoration:none;cursor:pointer;white-space:normal}
input[type="search"],input[type="text"]{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:9px 12px;min-width:0;width:100%}
.bar{height:8px;border-radius:4px;background:var(--sheet-2);overflow:hidden;border:1px solid var(--rule)}
.bar i{display:block;height:100%;background:var(--robe)}
.callout{border-left:3px solid var(--seal);background:var(--gold-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:14px}
.note{font-size:13px;color:var(--muted)}
kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--sheet)}
ul.clean{list-style:none;padding:0;margin:0;display:grid;gap:8px}
ol.steps{margin:0;padding-left:20px;display:grid;gap:6px}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.count{display:flex;align-items:baseline;gap:12px}
.count .n{font-family:var(--f-mono);font-size:clamp(56px,10vw,88px);font-weight:700;line-height:.9;color:var(--robe)}
.plan li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--rule)}
.plan li:last-child{border-bottom:0}
.plan input{margin-top:4px;accent-color:var(--robe);width:17px;height:17px;flex:none}
.plan .d{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:44px;flex:none;padding-top:2px}
.plan .today{color:var(--robe);font-weight:700}
.plan label{min-width:0}
.plan li.done label{text-decoration:line-through;color:var(--muted)}
.tile{display:grid;gap:6px;text-decoration:none;color:inherit;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:16px;transition:border-color .15s,transform .15s;font:inherit}
.tile:hover{border-color:var(--robe);transform:translateY(-2px)}
.tile h3{display:flex;justify-content:space-between;gap:8px}
.weak li{display:grid;grid-template-columns:minmax(0,130px) 1fr 44px;gap:10px;align-items:center;font-size:14px}

/* charter map */
.sec{display:grid;grid-template-columns:118px minmax(0,1fr);gap:0;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.sec .margin{background:var(--sheet-2);border-right:1px solid var(--rule);padding:14px 12px;display:grid;align-content:start;gap:6px}
.sec .num{font-family:var(--f-mono);font-weight:700;font-size:22px;color:var(--robe)}
.sec .mnote{font-size:12px;color:var(--muted);line-height:1.3}
.sec .body{padding:14px 16px;display:grid;gap:10px;min-width:0}
.sec .official{font-family:var(--f-text);font-size:15.5px;line-height:1.55}
.sec .official .sub{display:block;padding-left:1.4em;text-indent:-1.4em;margin-top:2px}
.sec .plain{font-size:14.5px}
.sec .hook{font-size:13.5px;color:var(--gold);font-weight:600}
.sec details summary{cursor:pointer;font-size:13px;font-weight:650;color:var(--muted)}
@media (max-width:560px){.sec{grid-template-columns:1fr}.sec .margin{border-right:0;border-bottom:1px solid var(--rule);grid-auto-flow:column;justify-content:start;align-items:baseline;gap:10px}}
.group-h{display:flex;align-items:baseline;gap:12px;margin-top:10px;flex-wrap:wrap}
.group-h span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.blur .plain,.blur .hook{filter:blur(6px);cursor:pointer;user-select:none;transition:filter .2s}
.blur.show .plain,.blur.show .hook{filter:none}
.blur .body::before{content:"Tap to reveal";font-size:12px;font-weight:700;color:var(--robe);letter-spacing:.06em;text-transform:uppercase}
.blur.show .body::before{content:none}

/* flashcards */
.deckbar{display:flex;gap:8px;flex-wrap:wrap}
.card-stage{perspective:1400px}
.fcard{position:relative;height:300px;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.2,1);cursor:pointer}
.fcard.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;border:1px solid var(--rule);background:var(--sheet);display:grid;place-items:center;padding:34px 24px 24px;text-align:center;overflow:auto}
.face.back{transform:rotateY(180deg);background:var(--sheet-2)}
.face .big{font-family:var(--f-mono);font-size:clamp(26px,5vw,40px);font-weight:700;color:var(--robe)}
.face .q{font-size:clamp(18px,2.6vw,22px);font-weight:650;font-stretch:90%}
.face .a{font-family:var(--f-text);font-size:17px;line-height:1.5;max-width:60ch}
.face .corner{position:absolute;top:12px;left:14px;font-size:11px}
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.boxes div{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:6px;text-align:center;font-size:12px}
.boxes b{display:block;font-family:var(--f-mono);font-size:18px}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grade .btn{padding:12px}
.again{border-color:var(--bad)!important;color:var(--bad)}
.good{border-color:var(--ok)!important;color:var(--ok)}

/* quiz */
.qcard{display:grid;gap:14px}
.qtext{font-size:clamp(18px,2.4vw,21px);font-weight:650;font-stretch:92%;line-height:1.35;padding-right:8px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--rule);background:var(--sheet);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;font-size:15px;width:100%}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt .k{font-family:var(--f-mono);font-weight:700;color:var(--muted);flex:none;width:18px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.pick{border-color:var(--robe);box-shadow:0 0 0 2px var(--robe-soft)}
.opt[disabled]{cursor:default}
.explain{font-family:var(--f-text);font-size:15.5px;background:var(--sheet-2);border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.combo{font-family:var(--f-mono);font-weight:700;color:var(--gold)}
.timer{font-family:var(--f-mono);font-weight:700;font-size:20px}
.timer.low{color:var(--bad)}
.stamp-host{position:relative}
.stamp{position:absolute;right:12px;top:-16px;transform:rotate(-8deg);border:3px solid currentColor;border-radius:6px;padding:2px 10px;font-weight:800;font-stretch:70%;letter-spacing:.08em;font-size:22px;pointer-events:none;animation:stamp .32s cubic-bezier(.2,1.6,.4,1) both;background:var(--sheet)}
.stamp.ok{color:var(--ok)}.stamp.no{color:var(--bad)}
@keyframes stamp{from{transform:rotate(-8deg) scale(2.2);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.results li{border-bottom:1px solid var(--rule);padding:10px 0;display:grid;gap:4px}
.score-big{font-family:var(--f-mono);font-size:56px;font-weight:700;line-height:1}

/* judge */
.facts{font-family:var(--f-text);font-size:16px;line-height:1.6;max-width:72ch}
.ladder{display:grid;gap:0}
.rung{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--rule)}
.rung .dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--rule);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--muted)}
.rung.on .dot{border-color:var(--robe);color:var(--robe)}
.rung.passed .dot{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.fb{font-size:14px;padding:8px 12px;border-radius:8px;margin-top:8px}
.fb.ok{background:var(--ok-soft);color:var(--ok)}.fb.no{background:var(--bad-soft);color:var(--bad)}
.verdict{border:2px solid var(--ink);border-radius:var(--r);padding:16px;display:grid;gap:8px}

/* cases */
.case{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.case>summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;gap:6px}
.case>summary::-webkit-details-marker{display:none}
.case>summary .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.case>summary h3{font-size:17px}
.case .yr{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.case[open]>summary{border-bottom:1px solid var(--rule);background:var(--sheet-2)}
.case .cb{padding:14px 16px;display:grid;gap:10px;font-size:14.5px}
.case dt{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.case dd{margin:2px 0 8px;font-family:var(--f-text);font-size:15px;max-width:75ch}
.ratio{border-left:3px solid var(--robe);padding-left:10px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.match{grid-template-columns:1fr}}
.mcol{display:grid;gap:8px;align-content:start}
.mi{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:10px 12px;text-align:left;cursor:pointer;font-size:14px}
.mi.sel{border-color:var(--robe);box-shadow:0 0 0 2px var(--robe-soft)}
.mi.gone{opacity:.35;pointer-events:none;border-style:dashed}
.mi.shake{animation:shake .3s;border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* frameworks */
.flow{display:grid;gap:8px}
.fstep{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;background:var(--sheet-2);border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
.fstep .n{font-family:var(--f-mono);font-weight:700;color:var(--robe);font-size:14px;min-width:28px}
.fstep.sub{margin-left:28px}
.fail{font-size:13px;color:var(--bad);font-weight:600}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tscroll{overflow-x:auto}
.tscroll table{min-width:460px}
.timeline{display:grid;gap:0;border-left:2px solid var(--rule);margin-left:8px}
.tl{position:relative;padding:4px 0 14px 20px}
.tl::before{content:"";position:absolute;left:-7px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--sheet);border:2px solid var(--robe)}
.tl .y{font-family:var(--f-mono);font-weight:700;color:var(--robe);font-size:13px}
.flag{font-size:13px;border:1px dashed var(--gold);color:var(--gold);border-radius:8px;padding:8px 12px;background:var(--gold-soft)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:650;font-size:14px;z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.25);animation:toast 2.4s forwards;max-width:calc(100% - 32px)}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* ============================== DATA ============================== */
const TEST_DATE = new Date(2026, 10, 23); // Mon Nov 23, 2026

const GROUPS = [
 ["guar","Guarantee","s. 1"],["fund","Fundamental Freedoms","s. 2"],["dem","Democratic Rights","ss. 3–5"],
 ["mob","Mobility Rights","s. 6"],["legal","Legal Rights","ss. 7–14"],["eq","Equality Rights","s. 15"],
 ["lang","Official Languages","ss. 16–22"],["mle","Minority Language Education","s. 23"],["enf","Enforcement","s. 24"],
 ["gen","General","ss. 25–31"],["app","Application","ss. 32–34"],["beyond","Outside the Charter","CA 1982"]
];

// n, group, margin note, official text (subs separated by |), plain English, memory hook, case ids, overridable by s.33
const S = [
 ["1","guar","Rights and freedoms in Canada","The Canadian Charter of Rights and Freedoms guarantees the rights and freedoms set out in it subject only to such reasonable limits prescribed by law as can be demonstrably justified in a free and democratic society.","Your rights are guaranteed, but the government can limit them if it proves the limit is reasonable. The test for that is the Oakes test.","s. 1 both GIVES and LIMITS. The burden is on the government.",["oakes","keegstra","zundel","bissonnette","vriend"],0],
 ["2","fund","Fundamental freedoms","Everyone has the following fundamental freedoms:|(a) freedom of conscience and religion;|(b) freedom of thought, belief, opinion and expression, including freedom of the press and other media of communication;|(c) freedom of peaceful assembly; and|(d) freedom of association.","(a) religion and conscience, (b) expression and the press, (c) peaceful protests and gatherings, (d) joining groups such as unions.","2 = R-E-A-A: Religion, Expression, Assembly, Association. 'Everyone' means non-citizens too.",["twu","ac","keegstra","zundel"],1],
 ["3","dem","Democratic rights of citizens","Every citizen of Canada has the right to vote in an election of members of the House of Commons or of a legislative assembly and to be qualified for membership therein.","Citizens can vote and run for office, federally and provincially.","3 = vote. Citizens only. s. 33 can NOT touch it.",[],0],
 ["4","dem","Maximum duration of legislative bodies","(1) No House of Commons and no legislative assembly shall continue for longer than five years from the date fixed for the return of the writs at a general election of its members.|(2) In time of real or apprehended war, invasion or insurrection, a House of Commons may be continued by Parliament and a legislative assembly may be continued by the legislature beyond five years if such continuation is not opposed by the votes of more than one-third of the members of the House of Commons or the legislative assembly, as the case may be.","Elections at least every 5 years. In war, invasion or insurrection a government can stay longer, unless more than one-third of members vote against it.","4 = max 5 years (war exception, blocked by more than 1/3).",[],0],
 ["5","dem","Annual sitting of legislative bodies","There shall be a sitting of Parliament and of each legislature at least once every twelve months.","Parliament and each legislature must meet at least once a year.","3-4-5: vote, 5 years, sit every year.",[],0],
 ["6","mob","Mobility of citizens","(1) Every citizen of Canada has the right to enter, remain in and leave Canada.|(2) Every citizen of Canada and every person who has the status of a permanent resident of Canada has the right (a) to move to and take up residence in any province; and (b) to pursue the gaining of a livelihood in any province.|(3) The rights specified in subsection (2) are subject to (a) any laws or practices of general application in force in a province other than those that discriminate among persons primarily on the basis of province of present or previous residence; and (b) any laws providing for reasonable residency requirements as a qualification for the receipt of publicly provided social services.|(4) Subsections (2) and (3) do not preclude any law, program or activity that has as its object the amelioration in a province of conditions of individuals in that province who are socially or economically disadvantaged if the rate of employment in that province is below the rate of employment in Canada.","6(1) citizens can enter, stay in and leave Canada. 6(2) citizens AND permanent residents can live and work in any province. Provinces can still have general laws and reasonable residency waiting periods for social services, and job programs if their employment rate is below the national rate.","6(1) = citizens only (border). 6(2) = citizens + PRs (provinces).",[],0],
 ["7","legal","Life, liberty and security of person","Everyone has the right to life, liberty and security of the person and the right not to be deprived thereof except in accordance with the principles of fundamental justice.","The government can only take away your life, liberty or security of the person in a fair way. Laws that are arbitrary, overbroad or grossly disproportionate break the principles of fundamental justice.","7 = L-L-S + PFJ. Carter: overbroad law = breach.",["carter","ac","bissonnette"],1],
 ["8","legal","Search or seizure","Everyone has the right to be secure against unreasonable search or seizure.","Police cannot search you or take your things unreasonably (usually they need a warrant).","8 = 'search'. Remedy for a bad search is usually s. 24(2), not Oakes.",[],1],
 ["9","legal","Detention or imprisonment","Everyone has the right not to be arbitrarily detained or imprisoned.","You can't be held or jailed without a good legal reason.","9 = no random detention.",[],1],
 ["10","legal","Arrest or detention","Everyone has the right on arrest or detention|(a) to be informed promptly of the reasons therefor;|(b) to retain and instruct counsel without delay and to be informed of that right; and|(c) to have the validity of the detention determined by way of habeas corpus and to be released if the detention is not lawful.","When arrested: (a) told why, (b) right to a lawyer and told about it, (c) habeas corpus: a court checks the detention is legal.","10 = Reasons, Lawyer, Habeas corpus (R-L-H).",[],1],
 ["11","legal","Proceedings in criminal and penal matters","Any person charged with an offence has the right|(a) to be informed without unreasonable delay of the specific offence;|(b) to be tried within a reasonable time;|(c) not to be compelled to be a witness in proceedings against that person in respect of the offence;|(d) to be presumed innocent until proven guilty according to law in a fair and public hearing by an independent and impartial tribunal;|(e) not to be denied reasonable bail without just cause;|(f) except in the case of an offence under military law tried before a military tribunal, to the benefit of trial by jury where the maximum punishment for the offence is imprisonment for five years or a more severe punishment;|(g) not to be found guilty on account of any act or omission unless, at the time of the act or omission, it constituted an offence under Canadian or international law or was criminal according to the general principles of law recognized by the community of nations;|(h) if finally acquitted of the offence, not to be tried for it again and, if finally found guilty and punished for the offence, not to be tried or punished for it again; and|(i) if found guilty of the offence and if the punishment for the offence has been varied between the time of commission and the time of sentencing, to the benefit of the lesser punishment.","Rights once CHARGED: know the charge, quick trial, don't have to testify against yourself, presumed innocent, reasonable bail, jury if 5+ years max, no retroactive crimes, no double jeopardy, and the lighter punishment if the law changed.","11(d) = presumed innocent (Oakes!). 11(h) = double jeopardy. 11(f) = jury at 5+ years.",["oakes"],1],
 ["12","legal","Treatment or punishment","Everyone has the right not to be subjected to any cruel and unusual treatment or punishment.","No punishment so harsh it is degrading or incompatible with human dignity.","12 = cruel & unusual. Bissonnette: 150 years without parole.",["bissonnette"],1],
 ["13","legal","Self-crimination","A witness who testifies in any proceedings has the right not to have any incriminating evidence so given used to incriminate that witness in any other proceedings, except in a prosecution for perjury or for the giving of contradictory evidence.","What you say as a witness can't be used against you in a different case, unless you lied (perjury).","13 = testimony protection (except perjury).",[],1],
 ["14","legal","Interpreter","A party or witness in any proceedings who does not understand or speak the language in which the proceedings are conducted or who is deaf has the right to the assistance of an interpreter.","You get an interpreter if you don't speak the court's language or are deaf.","14 = interpreter.",[],1],
 ["15","eq","Equality before and under law and equal protection and benefit of law","(1) Every individual is equal before and under the law and has the right to the equal protection and equal benefit of the law without discrimination and, in particular, without discrimination based on race, national or ethnic origin, colour, religion, sex, age or mental or physical disability.|(2) Subsection (1) does not preclude any law, program or activity that has as its object the amelioration of conditions of disadvantaged individuals or groups including those that are disadvantaged because of race, national or ethnic origin, colour, religion, sex, age or mental or physical disability.","Laws must treat people equally without discrimination. Listed grounds: race, national or ethnic origin, colour, religion, sex, age, mental or physical disability. Courts add 'analogous grounds' such as sexual orientation (Vriend). 15(2) allows affirmative action programs.","15 grounds: 'R-N-C-R-S-A-D' (Race, National/ethnic, Colour, Religion, Sex, Age, Disability). Came into force 1985.",["vriend","twu","ac","kapp","corbiere"],1],
 ["16","lang","Official languages of Canada","(1) English and French are the official languages of Canada and have equality of status and equal rights and privileges as to their use in all institutions of the Parliament and government of Canada.|(2) English and French are the official languages of New Brunswick and have equality of status and equal rights and privileges as to their use in all institutions of the legislature and government of New Brunswick.|(3) Nothing in this Charter limits the authority of Parliament or a legislature to advance the equality of status or use of English and French.","English and French are equal in the federal government and in New Brunswick (the only officially bilingual province). 16.1 protects NB's English and French communities, including separate schools.","16 = 'EN + FR'. New Brunswick is named.",[],0],
 ["17","lang","Proceedings of Parliament","(1) Everyone has the right to use English or French in any debates and other proceedings of Parliament.|(2) Everyone has the right to use English or French in any debates and other proceedings of the legislature of New Brunswick.","Speak English or French in Parliament or NB's legislature.","17–19: speak it, print it, use it in court.",[],0],
 ["18","lang","Parliamentary statutes and records","(1) The statutes, records and journals of Parliament shall be printed and published in English and French and both language versions are equally authoritative.|(2) The statutes, records and journals of the legislature of New Brunswick shall be printed and published in English and French and both language versions are equally authoritative.","Laws are published in both languages, both equally official.","",[],0],
 ["19","lang","Proceedings in courts established by Parliament","(1) Either English or French may be used by any person in, or in any pleading in or process issuing from, any court established by Parliament.|(2) Either English or French may be used by any person in, or in any pleading in or process issuing from, any court of New Brunswick.","Use either language in federal courts and NB courts.","",[],0],
 ["20","lang","Communications by public with federal institutions","(1) Any member of the public in Canada has the right to communicate with, and to receive available services from, any head or central office of an institution of the Parliament or government of Canada in English or French, and has the same right with respect to any other office of any such institution where (a) there is a significant demand for communications with and services from that office in such language; or (b) due to the nature of the office, it is reasonable that communications with and services from that office be available in both English and French.|(2) Any member of the public in New Brunswick has the right to communicate with, and to receive available services from, any office of an institution of the legislature or government of New Brunswick in English or French.","Get federal government service in English or French (head offices always; other offices where there's significant demand).","",[],0],
 ["21","lang","Continuation of existing constitutional provisions","Nothing in sections 16 to 20 abrogates or derogates from any right, privilege or obligation with respect to the English and French languages, or either of them, that exists or is continued by virtue of any other provision of the Constitution of Canada.","Older constitutional language rights still apply.","",[],0],
 ["22","lang","Rights and privileges preserved","Nothing in sections 16 to 20 abrogates or derogates from any legal or customary right or privilege acquired or enjoyed either before or after the coming into force of this Charter with respect to any language that is not English or French.","Rights for other languages (which may include Indigenous languages) are not taken away.","",[],0],
 ["23","mle","Language of instruction","(1) Citizens of Canada (a) whose first language learned and still understood is that of the English or French linguistic minority population of the province in which they reside, or (b) who have received their primary school instruction in Canada in English or French and reside in a province where the language in which they received that instruction is the language of the English or French linguistic minority population of the province, have the right to have their children receive primary and secondary school instruction in that language in that province.|(2) Citizens of Canada of whom any child has received or is receiving primary or secondary school instruction in English or French in Canada, have the right to have all their children receive primary and secondary school instruction in the same language.|(3) The right ... (a) applies wherever in the province the number of children of citizens who have such a right is sufficient to warrant the provision to them out of public funds of minority language instruction; and (b) includes, where the number of those children so warrants, the right to have them receive that instruction in minority language educational facilities provided out of public funds.","English-minority parents in Quebec and French-minority parents elsewhere can have their kids schooled in their language, publicly funded, 'where numbers warrant'.","23 = 'where numbers warrant'.",[],0],
 ["24","enf","Enforcement of guaranteed rights and freedoms","(1) Anyone whose rights or freedoms, as guaranteed by this Charter, have been infringed or denied may apply to a court of competent jurisdiction to obtain such remedy as the court considers appropriate and just in the circumstances.|(2) Where, in proceedings under subsection (1), a court concludes that evidence was obtained in a manner that infringed or denied any rights or freedoms guaranteed by this Charter, the evidence shall be excluded if it is established that, having regard to all the circumstances, the admission of it in the proceedings would bring the administration of justice into disrepute.","24(1): if your rights were breached, a court can give an 'appropriate and just' remedy. 24(2): evidence gotten by breaking your rights is thrown out if using it would bring the justice system into disrepute.","24 = the 'so what?' section: remedies + excluding evidence.",[],0],
 ["25","gen","Aboriginal rights and freedoms not affected by Charter","The guarantee in this Charter of certain rights and freedoms shall not be construed so as to abrogate or derogate from any aboriginal, treaty or other rights or freedoms that pertain to the aboriginal peoples of Canada including|(a) any rights or freedoms that have been recognized by the Royal Proclamation of October 7, 1763; and|(b) any rights or freedoms that now exist by way of land claims agreements or may be so acquired.","Other Charter rights can't be used to wear down Indigenous, treaty or other Indigenous rights. Called a 'shield'. Mentions the Royal Proclamation of 1763 and land claims agreements.","25 = SHIELD (inside the Charter). 35 = the rights themselves (outside the Charter).",["dickson","kapp","corbiere"],0],
 ["26","gen","Other rights and freedoms not affected by Charter","The guarantee in this Charter of certain rights and freedoms shall not be construed as denying the existence of any other rights or freedoms that exist in Canada.","The Charter isn't the only list of rights. Rights in other laws still exist.","",[],0],
 ["27","gen","Multicultural heritage","This Charter shall be interpreted in a manner consistent with the preservation and enhancement of the multicultural heritage of Canadians.","Courts must read the Charter in a way that supports multiculturalism (used in Keegstra).","27 = multiculturalism.",["keegstra"],0],
 ["28","gen","Rights guaranteed equally to both sexes","Notwithstanding anything in this Charter, the rights and freedoms referred to in it are guaranteed equally to male and female persons.","All Charter rights apply equally to men and women, no matter what else the Charter says.","28 = sex equality. Starts with 'Notwithstanding', so s. 33 can't override it.",[],0],
 ["29","gen","Rights respecting certain schools preserved","Nothing in this Charter abrogates or derogates from any rights or privileges guaranteed by or under the Constitution of Canada in respect of denominational, separate or dissentient schools.","Protects existing religious school rights (why Ontario funds Catholic schools).","29 = Catholic/separate schools.",[],0],
 ["30","gen","Application to territories","A reference in this Charter to a province or to the legislative assembly or legislature of a province shall be deemed to include a reference to the Yukon Territory and the Northwest Territories, or to the appropriate legislative authority thereof, as the case may be.","'Province' in the Charter includes the territories.","",[],0],
 ["31","gen","Legislative powers not extended","Nothing in this Charter extends the legislative powers of any body or authority.","The Charter doesn't give any government new law-making powers.","",[],0],
 ["32","app","Application of Charter","(1) This Charter applies (a) to the Parliament and government of Canada in respect of all matters within the authority of Parliament including all matters relating to the Yukon Territory and Northwest Territories; and (b) to the legislature and government of each province in respect of all matters within the authority of the legislature of each province.|(2) Notwithstanding subsection (1), section 15 shall not have effect until three years after this section comes into force.","The Charter only applies to GOVERNMENT (federal and provincial laws and actions), not private disputes between people or businesses. Those go to human rights codes. s. 15 was delayed 3 years (in force April 17, 1985).","32 = 'Charter vs. government ONLY'.",[],0],
 ["33","app","Exception where express declaration","(1) Parliament or the legislature of a province may expressly declare in an Act of Parliament or of the legislature, as the case may be, that the Act or a provision thereof shall operate notwithstanding a provision included in section 2 or sections 7 to 15 of this Charter.|(2) An Act or a provision of an Act in respect of which a declaration made under this section is in effect shall have such operation as it would have but for the provision of this Charter referred to in the declaration.|(3) A declaration made under subsection (1) shall cease to have effect five years after it comes into force or on such earlier date as may be specified in the declaration.|(4) Parliament or a legislature of a province may re-enact a declaration made under subsection (1).|(5) Subsection (3) applies in respect of a re-enactment made under subsection (4).","The NOTWITHSTANDING CLAUSE: a government can pass a law that overrides s. 2 or ss. 7–15, but it must say so expressly, and it expires after 5 years unless re-enacted (roughly one election cycle, so voters get a say).","33 overrides 2 + 7–15 only, lasts 5 years, renewable.",[],0],
 ["34","app","Citation","This Part may be cited as the Canadian Charter of Rights and Freedoms.","The official name.","",[],0],
 ["35","beyond","Recognition of existing aboriginal and treaty rights (Constitution Act, 1982, Part II)","(1) The existing aboriginal and treaty rights of the aboriginal peoples of Canada are hereby recognized and affirmed.|(2) In this Act, 'aboriginal peoples of Canada' includes the Indian, Inuit and Métis peoples of Canada.|(3) For greater certainty, in subsection (1) 'treaty rights' includes rights that now exist by way of land claims agreements or may be so acquired.|(4) Notwithstanding any other provision of this Act, the aboriginal and treaty rights referred to in subsection (1) are guaranteed equally to male and female persons.","Recognizes (does not create) existing Aboriginal and treaty rights of First Nations, Inuit and Métis. It is OUTSIDE the Charter, so s. 1 and s. 33 don't apply. Limits are tested with the Sparrow test instead.","35 is outside the Charter: no s. 1, no s. 33, use SPARROW.",["sparrow","powley","marshall","vanderpeet","delgamuukw","tsilhqotin","daniels"],0],
 ["52","beyond","Primacy of Constitution of Canada (Constitution Act, 1982)","(1) The Constitution of Canada is the supreme law of Canada, and any law that is inconsistent with the provisions of the Constitution is, to the extent of the inconsistency, of no force or effect.","The Constitution beats every other law. A law that conflicts with it is 'of no force or effect' to the extent it conflicts. This is how courts strike laws down.","52 = 'supreme law'. 24(1) = remedies for people; 52(1) = remedies against laws.",["carter","bissonnette","oakes"],0]
];

const CASES = [
 {id:"oakes",n:"R v Oakes",y:1986,k:"charter",s:["11(d)","1"],one:"Created the Oakes test for s. 1; a reverse-onus drug law failed rational connection.",
  f:"David Oakes was found with drugs. Under s. 8 of the Narcotic Control Act, once possession was proven the ACCUSED had to prove he was not trafficking (a 'reverse onus').",
  i:"Does the reverse onus violate the s. 11(d) presumption of innocence? If so, is it saved by s. 1?",
  d:"Violated s. 11(d) and NOT justified under s. 1. Section 8 of the NCA was of no force or effect.",
  r:"Set out the Oakes test: (1) pressing and substantial objective; (2) proportionality: rational connection, minimal impairment, proportionate effects. Here there was no rational connection between possessing a small amount and intent to traffic."},
 {id:"vriend",n:"Vriend v Alberta",y:1998,k:"charter",s:["15","1"],one:"Sexual orientation 'read in' to Alberta's human rights law; no pressing objective for excluding it.",
  f:"Delwin Vriend was fired from a private Christian college for being gay. Alberta's Individual's Rights Protection Act did not list sexual orientation, so he couldn't complain.",
  i:"Does leaving sexual orientation out of the provincial human rights law violate s. 15?",
  d:"Yes. Violated s. 15 and failed s. 1 (Alberta showed no pressing and substantial objective). Sexual orientation was READ IN to the Act.",
  r:"Classic example of the 'reading in' remedy. Your OJEN handout prints the year as 1988; the decision was 1998.",x:"Remedy: reading in."},
 {id:"keegstra",n:"R v Keegstra",y:1990,k:"charter",s:["2(b)","1","27"],one:"Hate-promotion law limits expression but is justified under s. 1.",
  f:"Jim Keegstra, an Alberta high school teacher, taught antisemitic content and expected students to repeat it. He was charged under Criminal Code s. 319 (wilfully promoting hatred against an identifiable group).",
  i:"Does s. 319 violate freedom of expression, and if so, is it justified?",
  d:"Violated s. 2(b) but was a REASONABLE LIMIT under s. 1. Conviction stood.",
  r:"Preventing hatred protects equality and Canada's multicultural heritage (s. 27). Your slides date it 1984 (when he was charged); the SCC ruled in 1990."},
 {id:"zundel",n:"R v Zundel",y:1992,k:"charter",s:["2(b)","1"],one:"'False news' law was too broad and could not be justified under s. 1.",
  f:"Ernst Zundel published a pamphlet claiming the Holocaust did not happen. He was charged under Criminal Code s. 181, spreading false news likely to cause injury or mischief to a public interest.",
  i:"Does s. 181 violate s. 2(b), and is it justified?",
  d:"Violated s. 2(b) and was NOT justified. The offence was far too broad (it could catch almost any false statement) and was struck down.",
  r:"Compare with Keegstra: a narrow, targeted hate law survives; a vague, sweeping one fails minimal impairment."},
 {id:"carter",n:"Carter v Canada (AG)",y:2015,k:"charter",s:["7","15","1"],one:"Blanket ban on assisted dying was overbroad, violating s. 7. Unanimous.",
  f:"Gloria Taylor had ALS and did not want to 'live in a bedridden state, stripped of dignity and independence'. With Lee Carter, Hollis Johnson, a doctor and the BC Civil Liberties Association, she challenged Criminal Code ss. 14 and 241(b), which banned assisted suicide.",
  i:"(1) Do ss. 14 and 241(b) violate s. 7? (2) Do they violate s. 15?",
  d:"Unanimous: struck down as overbroad, violating s. 7, not saved by s. 1. s. 15 did not need to be decided. The ruling was suspended 12 months (later extended 4 months); new MAID law got royal assent June 17, 2016.",
  r:"LIFE: some people ended their lives early, fearing they couldn't later. LIBERTY: it took away control over medical decisions. SECURITY: it left people in intolerable suffering. The goal (protecting vulnerable people) was valid, but the ban also caught competent, informed, consenting adults like Taylor.",
  x:"Overruled Rodriguez v BC (1993). Trial judge gave Taylor a constitutional exemption. Remedy: suspended declaration of invalidity."},
 {id:"bissonnette",n:"R v Bissonnette",y:2022,k:"charter",s:["12","7","1"],one:"Stacked parole ineligibility that removes any hope of release is cruel and unusual (s. 12).",
  f:"On Jan 29, 2017, Alexandre Bissonnette killed six people at a Quebec City mosque. Criminal Code s. 745.51 let judges stack 25-year parole ineligibility periods consecutively; the Crown asked for 150 years.",
  i:"(1) Does s. 745.51 violate s. 12 or s. 7? (2) Can it be saved under s. 1?",
  d:"Unanimous: violated s. 12, not saved by s. 1. Declared of no force or effect immediately. s. 7 was not needed. He serves the periods concurrently (25 years).",
  r:"A parole ineligibility period longer than a lifetime is degrading and incompatible with human dignity because it removes any realistic chance of rehabilitation. A punishment that is cruel and unusual by its nature is almost impossible to justify under s. 1.",
  x:"Consecutive = one after another. Concurrent = at the same time."},
 {id:"ac",n:"A.C. v Manitoba (Director of Child and Family Services)",y:2009,k:"charter",s:["2(a)","7","15"],one:"Under-16 treatment orders are constitutional if 'best interests' respects the teen's maturity. 6–1.",
  f:"A.C., two months before her 15th birthday, had internal bleeding from Crohn's disease. As a devout Jehovah's Witness she refused blood transfusions. Child and Family Services apprehended her and a court ordered transfusions under ss. 25(8) and (9) of Manitoba's Child and Family Services Act (the court decides 'best interests' for under-16s). She recovered fully.",
  i:"Do ss. 25(8) and (9) violate ss. 2(a), 7 and 15(1)?",
  d:"6–1: the provisions are CONSTITUTIONAL when 'best interests' is read to give weight to the young person's maturity.",
  r:"s. 7: not arbitrary, since teens can prove they are mature enough. s. 15: not age discrimination, because the decision turns on maturity, not age. s. 2(a): religion is a factor in best interests; even if infringed, s. 1 justifies protecting the life and health of vulnerable young people.",
  x:"DISSENT (Justice Binnie): violated ss. 2(a) and 7. A mature minor should decide for herself; presuming every under-16 lacks capacity is arbitrary."},
 {id:"twu",n:"Law Society of BC v Trinity Western University",y:2018,k:"charter",s:["2(a)","15","1"],one:"Refusing to accredit TWU's law school was a reasonable balance of religion vs. LGBTQ equality.",
  f:"TWU, a private evangelical Christian university, made all students sign a Community Covenant banning sex outside marriage between a man and a woman. It proposed a law school. The Law Societies of BC and Ontario refused to accredit it.",
  i:"Was the refusal reasonable? Does it infringe TWU students' s. 2(a) religious freedom? If so, is it a proportionate balance with equality?",
  d:"Appeal allowed (7–2): the Law Society's decision was REASONABLE. Regulating in the public interest includes promoting equality and diversity in the legal profession.",
  r:"Majority: religious freedom was infringed, but only in a MINOR way, because studying law in a religious setting is a preference, not a religious requirement. Uses the Doré framework (decision-makers must proportionately balance Charter rights). Concurring: McLachlin CJ (serious infringement, still reasonable); Rowe J (no infringement, since religious freedom doesn't protect communal practice).",
  x:"DISSENT (Côté and Brown JJ): law societies should only look at whether graduates are qualified; the public interest includes religious minorities too. Companion case: TWU v Law Society of Upper Canada."},
 {id:"butler",n:"R v Butler",y:1992,k:"charter",s:["2(b)"],one:"Obscenity law 'read down' to catch only certain harmful material.",
  f:"Challenge to the very broad Criminal Code obscenity provisions as a violation of freedom of expression.",i:"Can the obscenity law be saved?",
  d:"The SCC read down the law, interpreting it narrowly to catch only certain forms of pornography.",r:"The OJEN handout's example of the READING DOWN remedy."},
 {id:"sparrow",n:"R v Sparrow",y:1990,k:"indig",s:["35"],one:"First SCC case interpreting s. 35. Created the Sparrow test for justifying limits on Aboriginal rights.",
  f:"In 1984, two years after s. 35 came in, Musqueam member Ron Sparrow was charged under the federal Fisheries Act for fishing in the Fraser River with a net longer than allowed. He argued the law interfered with the Musqueam's constitutionally protected Aboriginal right to fish.",
  i:"Is the Musqueam right to fish protected by s. 35? Can the government limit it?",
  d:"The Musqueam proved a right to a food, social and ceremonial fishery, subject to conservation, and that fishery has PRIORITY over other fisheries. s. 35 rights are not absolute: they can be limited or regulated if the limit passes the Sparrow test. A new trial was ordered.",
  r:"The Supreme Court's FIRST confirmation of an Aboriginal right under s. 35. s. 35 gives limited protection from government regulation. It only protects rights that existed in 1982; rights extinguished before 1982 are not revived. Being REGULATED before 1982 does not mean a right was extinguished: extinguishment needs the Crown's 'clear and plain intent'. Step 1: claimant proves a right and a prima facie infringement. Step 2: Crown proves a valid (compelling and substantial) objective such as conservation, and that it respected the honour of the Crown: priority, minimal impairment, compensation, consultation.",
  x:"The Court rejected the argument that the Musqueam fishing right equals the property rights of non-Indigenous people. It also accepted, without question, the Doctrine of Discovery: Indigenous peoples may occupy their territory, but sovereignty, legislative power and underlying title were said to belong to the Crown from the outset. Afterwards, Ottawa created the Aboriginal Fisheries Strategy to regulate First Nations' food, social and ceremonial fisheries."},
 {id:"powley",n:"R v Powley",y:2003,k:"indig",s:["35(2)"],one:"First SCC recognition of a Métis s. 35 right (to hunt for food). Set the test for Métis rights: self-identification, ancestral connection, community acceptance.",
  f:"On Oct 22, 1993, Steve Powley and his son Roddy shot a bull moose near Sault Ste. Marie without an Ontario licence. Steve tagged it with his Ontario Métis number and a note saying the meat was for winter. They were charged under the Game and Fish Act.",
  i:"Do Métis people of the Sault Ste. Marie community have a s. 35 Aboriginal right to hunt for food?",
  d:"Yes. Acquitted at trial (1998), on appeal (2000), at the Ontario Court of Appeal (2001), and at the SCC (Sept 19, 2003, unanimous).",
  r:"First time the SCC had to decide how to identify Métis for s. 35. 'Métis' does NOT mean everyone with mixed European and Indigenous ancestry. It means people of mixed ancestry in a specific area whose ancestors had their own distinct customs, way of life and collective identity BEFORE European control was established there. The Court did not set a strict test for identity but gave three general requirements: (1) SELF-IDENTIFICATION, (2) ANCESTRAL CONNECTION to the historic community, (3) COMMUNITY ACCEPTANCE by the modern community.",
  x:"Métis rights are SITE-SPECIFIC, not free-floating across a province or the country: the right was to hunt for food in the Sault Ste. Marie area. The Powleys had to prove their ancestors belonged to the historic Métis community there. Why it's hard for others: claimants must prove a historic Métis community existed over 100 years ago in that exact location and that their ancestors were part of it."},
 {id:"marshall",n:"R v Marshall (Marshall I & II)",y:1999,k:"indig",s:["35"],one:"Recognized a Mi'kmaq treaty right to a commercial fishery, limited to a 'moderate livelihood'.",
  f:"In summer 1993, after 12 years in prison on a wrongful murder conviction, Donald Marshall Jr., a Mi'kmaq man, caught 463 lbs of eel near Pomquet Harbour, Nova Scotia, and sold them for $787.10 without a licence, out of season, with an illegal net. His defence: a treaty right promised by the British in 1760.",
  i:"Does the Peace and Friendship Treaty (signed at Halifax on March 10, 1760, with Governor Charles Lawrence), including its unwritten oral terms, give a modern right to catch and sell fish?",
  d:"Majority: acquitted. The Mi'kmaq had promised not to help the French or attack the British, to release British prisoners, and to trade only at British 'truck houses' (trading posts). That trade promise is the basis of a modern right to fish, hunt and gather to trade, limited to a MODERATE LIVELIHOOD.",
  r:"Treaty interpretation principle: it would be UNCONSCIONABLE for the Crown to rely on the written terms while ignoring the oral terms, so courts look at why both sides made the treaty (the British alone 'held the pen'). Treaty rights aren't frozen: when truck houses disappeared, only the mechanism ended, not the right. Moderate livelihood = enough for day-to-day needs (food, clothing, housing and a few amenities) but NOT the accumulation of wealth. The limit answered fears the Mi'kmaq could take all the fish with factory trawlers.",
  x:"MARSHALL II: after a backlash by non-Indigenous commercial fishers in fall 1999, the Court took the unusual step of issuing a second set of reasons confirming that the federal government CAN regulate the Mi'kmaq commercial fishery (justified limits). Over 25 years later the Mi'kmaq are still fighting to have the right respected: see the film Trapped on the Water. Dissent (2 judges): the right to fish was only the same as any British subject's."},
 {id:"vanderpeet",n:"R v Van der Peet",y:1996,k:"indig",s:["35"],one:"Aboriginal right = practice integral to the group's distinctive culture before contact.",
  f:"Dorothy Van der Peet, a Stó:lō woman, sold fish caught under a food-fishing licence.",i:"Is selling fish a protected Aboriginal right?",
  d:"No, for this group. Exchange of fish for money was not shown to be integral to Stó:lō culture before contact.",
  r:"The 'integral to a distinctive culture' test: the practice must have existed before European contact and be central to the society. Food, social and ceremonial fishing is protected and can use modern gear."},
 {id:"calder",n:"Calder v BC (AG)",y:1973,k:"indig",s:["35"],one:"First time Canadian courts recognized that Aboriginal title exists in law.",
  f:"Frank Calder and the Nisga'a claimed title to their land in BC.",i:"Does Aboriginal title exist in Canadian law?",
  d:"The Nisga'a lost on a technicality, but six judges agreed Aboriginal title exists in Canadian law.",
  r:"Led to Canada's land claims process and eventually the Nisga'a Final Agreement (2000)."},
 {id:"delgamuukw",n:"Delgamuukw v BC",y:1997,k:"indig",s:["35"],one:"Aboriginal title is a constitutional right; oral histories are valid evidence.",
  f:"Gitxsan and Wet'suwet'en hereditary chiefs claimed title to their territory.",i:"What is Aboriginal title and how is it proven?",
  d:"Title requires exclusive occupation at the time the Crown asserted sovereignty. Oral histories must be accepted as evidence. A new trial was ordered.",
  r:"Strong statements on consultation and compensation before title is infringed."},
 {id:"tsilhqotin",n:"Tsilhqot'in Nation v BC",y:2014,k:"indig",s:["35"],one:"First court declaration of Aboriginal title (about 1,750 km²).",
  f:"The Tsilhqot'in opposed logging licences on their traditional territory in BC's interior.",i:"Do they hold Aboriginal title?",
  d:"Yes. Title declared over about 1,750 km².",
  r:"Title test: sufficient OCCUPATION, CONTINUITY and EXCLUSIVITY. On titled land the Crown must get consent or justify infringement."},
 {id:"daniels",n:"Daniels v Canada",y:2016,k:"indig",s:["91(24) CA 1867"],one:"Métis and non-status Indians are 'Indians' under federal jurisdiction (s. 91(24)).",
  f:"Harry Daniels and others sought a declaration about which government is responsible for Métis and non-status Indians.",i:"Are they 'Indians' under s. 91(24) of the Constitution Act, 1867?",
  d:"Yes (unanimous, April 14, 2016). Ottawa is responsible for negotiating with them.",r:"Does NOT give anyone Indian Act status."},
 {id:"dickson",n:"Dickson v Vuntut Gwitchin First Nation",y:2024,k:"indig",s:["25","15"],one:"Set the modern s. 25 test: s. 25 shields Indigenous difference only where there is an irreconcilable conflict.",
  f:"Cindy Dickson, a citizen of the Vuntut Gwitchin First Nation (Yukon) living away from the settlement land, challenged the First Nation's rule that council members must live there.",
  i:"Does the residency rule breach s. 15? If so, does s. 25 shield it?",
  d:"The rule was a prima facie s. 15 breach, but s. 25 shielded it; the residency requirement stands.",
  r:"Four steps: (1) prima facie Charter breach; (2) the right falls within s. 25; (3) irreconcilable conflict, proven by the party invoking s. 25; (4) check other limits on the s. 25 right. Combines the 'shield' and 'interpretive prism' approaches from Kapp."},
 {id:"kapp",n:"R v Kapp",y:2008,k:"indig",s:["15(2)","25"],one:"Communal Aboriginal fishing licence upheld as an ameliorative program under s. 15(2).",
  f:"Non-Aboriginal commercial fishers protested a 24-hour fishery reserved for three First Nations and argued it discriminated by race.",i:"Does the program violate s. 15?",
  d:"No. It was an ameliorative program protected by s. 15(2). Justice Bastarache would have used s. 25 as a 'shield'.",r:"Source of the shield vs interpretive-prism debate about s. 25."},
 {id:"corbiere",n:"Corbiere v Canada",y:1999,k:"indig",s:["15","25"],one:"Excluding off-reserve band members from band votes violated s. 15.",
  f:"Indian Act rules denied band members who did not live on reserve the right to vote in band elections.",i:"Does this violate s. 15?",
  d:"Yes. 'Aboriginality-residence' is an analogous ground.",r:"First SCC reference to the 'shielding' function of s. 25 and that it protects broader rights than s. 35."},
 {id:"drybones",n:"R v Drybones",y:1970,k:"hr",s:["Bill of Rights"],one:"Bill of Rights used to strike an Indian Act offence (intoxicated off-reserve).",
  f:"Joseph Drybones was convicted under an Indian Act provision making it an offence for an 'Indian' to be intoxicated off reserve, with harsher penalties than others faced.",i:"Does this deny equality before the law under the 1960 Canadian Bill of Rights?",
  d:"Yes. The provision was inoperative.",r:"In Lavell (1973) the court refused to apply the Bill of Rights to Indian Act status rules that discriminated against women, a widely criticized decision fixed by Bill C-31 (1985)."},
 {id:"turnbull",n:"Turnbull v Famous Players",y:2001,k:"hr",s:["Ontario Human Rights Code"],one:"Human rights complaint over theatres without wheelchair access: a private business, so the Code applies, not the Charter.",
  f:"People who use wheelchairs complained that Famous Players theatres were not accessible.",i:"Is a lack of wheelchair access discrimination under provincial human rights law?",
  d:"Heard by Ontario's human rights system, which found discrimination based on disability.",r:"Shows s. 32 in action: a private company isn't bound by the Charter, but it IS bound by the provincial Human Rights Code."},
 {id:"ipperwash",n:"The Ipperwash Inquiry",y:2007,k:"indig",s:["35","Royal Proclamation"],one:"Public inquiry into the 1995 police killing of Dudley George; 100 recommendations.",
  f:"Stoney Point land was taken for a WWII army camp (Camp Ipperwash) with a promise to return it. In 1928 shoreline had been surrendered under questionable circumstances and in 1936 Ontario made Ipperwash Provincial Park, despite a burial site. On Sept 4, 1995, Stoney Point people occupied the park. On Sept 6, OPP riot police moved in; Sgt. Ken Deane shot Anthony 'Dudley' George, who died early Sept 7.",
  i:"What happened and how can violence be avoided in future Indigenous land protests?",
  d:"Inquiry (Commissioner Justice Sidney Linden, set up 2003, report May 31, 2007) found Dudley George had NO gun. Deane was convicted of criminal negligence causing death (1997). Premier Mike Harris's government treated it as a law-enforcement issue rather than an Aboriginal rights issue.",
  r:"Key recommendations: treat protests as being about land and treaty rights; create a Treaty Commission of Ontario; consult and accommodate on resources; protect burial sites; public education; separate the roles of government and police; peacekeeping approach to protests; support First Nations policing; a new Ministry of Aboriginal Affairs."}

const TERMS = [
 ["Entrenched","Built into the Constitution so it can't be changed by an ordinary law (the Charter is entrenched; the 1960 Bill of Rights was not)."],
 ["Patriation","Bringing the Constitution 'home' from Britain in 1982 so Canada could amend it itself."],
 ["Prima facie","'On its face'. At first look, before any justification is considered."],
 ["Ratio decidendi","The legal rule or reason a case was decided on, which binds later courts."],
 ["Dissent","A judge's opinion disagreeing with the majority's outcome (e.g., Binnie J in A.C.)."],
 ["Concurring opinion","Agrees with the outcome but for different reasons (McLachlin CJ and Rowe J in TWU)."],
 ["Appellant / Respondent","Appellant brings the appeal; respondent answers it."],
 ["Leave to appeal","Permission to appeal, required by the Supreme Court of Canada for most cases."],
 ["Onus / burden of proof","Who must prove something. Under s. 1 the government has the onus, on a balance of probabilities."],
 ["Balance of probabilities","More likely than not (civil standard; used in s. 1 and human rights tribunals)."],
 ["Reverse onus","When the accused must disprove something (Oakes)."],
 ["Habeas corpus","Court order requiring someone detained to be brought to court to check the detention is legal (s. 10(c))."],
 ["Principles of fundamental justice","Basic fairness rules in s. 7. A law can't be arbitrary, overbroad or grossly disproportionate."],
 ["Overbroad","A law that catches more people or conduct than needed for its purpose (Carter)."],
 ["Analogous ground","A ground not listed in s. 15 that courts treat like one (sexual orientation, marital status, citizenship, Aboriginality-residence)."],
 ["Mature minor","A young person who can show enough maturity to make their own medical decisions (A.C.)."],
 ["Deference","Courts giving legislatures room when they balance competing interests."],
 ["Reading in","Court adds words to an under-inclusive law (Vriend)."],
 ["Reading down","Court interprets a broad law narrowly so it fits the Charter (Butler)."],
 ["Striking down","Declaring a law of no force or effect (s. 52)."],
 ["Severance / partial invalidity","Striking only the bad part of a law."],
 ["Suspended declaration of invalidity","Law is declared invalid but stays in force for a set time so government can fix it (Carter: 12 months)."],
 ["Constitutional exemption","Law stays valid but one person is exempt. Rare (Taylor at trial)."],
 ["Parole ineligibility period","Time before a prisoner can apply for parole (25 years for first-degree murder)."],
 ["Notwithstanding clause","s. 33. Lets a legislature override s. 2 and ss. 7–15 for 5 renewable years."],
 ["Fiduciary duty","The Crown's duty to act in the best interests of Indigenous peoples, like a trustee."],
 ["Honour of the Crown","The Crown must always act honourably and with integrity in dealings with Indigenous peoples."],
 ["Duty to consult","The Crown must consult (and sometimes accommodate) Indigenous groups before decisions that may affect their rights."],
 ["Extinguishment","Permanent removal of an Aboriginal right. Possible before 1982; s. 35 protects only rights 'existing' in 1982."],
 ["Aboriginal right","Inherent collective right from occupation before Europeans, e.g., practices integral to the culture."],
 ["Treaty right","Right from an agreement between the Crown and an Indigenous nation (incl. modern land claims)."],
 ["Aboriginal title","A collective right to the land itself. Needs occupation, continuity and exclusivity."],
 ["Usufructuary right","A right to use land that is technically owned by someone else (the Crown)."],
 ["Moderate livelihood","Marshall: treaty trading rights cover basic needs, not large commercial business."],
 ["Truckhouse","18th-century British trading post where the Mi'kmaq traded under the treaty."],
 ["Status / non-status Indian","Legal categories under the Indian Act. Status brings some rights (e.g., certain tax exemptions on reserve)."],
 ["Bill C-31 (1985)","Indian Act amendment ending loss of status for women who 'married out'. Created a 'second-generation cut-off'."],
 ["Enfranchisement","Process by which Indigenous people lost Indian Act status, voluntarily or by force."],
 ["Royal Proclamation, 1763","Issued by King George III on Oct 7, 1763. Made protecting Indigenous lands Crown policy; basis for treaty-making; named in s. 25."],
 ["Natural rights","Rights everyone has by being human; universal and absolute."],
 ["Positive rights","Rights created by law and tied to society's well-being, so they can be limited. Canada's Charter is closer to this (s. 1)."],
 ["Discrimination","Treating a person differently or adversely for no valid reason."],
 ["Prejudice","An opinion, often unfavourable, based on irrelevant or inadequate knowledge."],
 ["Stereotype","Judging one member of a group and applying that judgment to all members."],
 ["Bona fide","In good faith; genuine (e.g., a bona fide occupational requirement)."],
 ["Undue hardship","An accommodation so costly or risky it outweighs the benefit; the limit of the duty to accommodate."],
 ["Corporate liability","A company is responsible for harassment by an employee in a position of power (manager, supervisor)."],
 ["Vicarious liability","Employer is responsible for discriminatory acts of any employee (but not their harassing conduct)."]
];

function todayStr(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function touch(){const t=todayStr();if(ST.last===t)return;const y=new Date();y.setDate(y.getDate()-1);let ok=ST.last===todayStr(y);if(!ok&&y.getDay()===6){const f=new Date();f.setDate(f.getDate()-2);ok=ST.last===todayStr(f)}ST.streak=ok?ST.streak+1:1;ST.last=t;save();hud()}
function level(xp){let i=0;for(let k=0;k<LEVELS.length;k++)if(xp>=LEVELS[k][0])i=k;return i}
function addXP(n){const before=level(ST.xp);ST.xp+=n;touch();save();hud();const after=level(ST.xp);if(after>before)toast("Promoted: "+LEVELS[after][1])}
function hud(){
  const i=level(ST.xp),cur=LEVELS[i][0],next=LEVELS[i+1]?LEVELS[i+1][0]:cur+1;
  $("#st-xp").textContent=ST.xp;$("#st-streak").textContent=ST.streak;$("#st-lvl").textContent=LEVELS[i][1];
  $("#st-bar").style.width=(LEVELS[i+1]?Math.min(100,(ST.xp-cur)/(next-cur)*100):100)+"%";
}
function rec(cat,ok){const c=ST.cats[cat]||{r:0,t:0};c.t++;if(ok)c.r++;ST.cats[cat]=c;save()}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

V.charter=()=>{
  let hide=false,q="",grp="all";
  app.innerHTML=`<section class="view">
   <div><span class="eyebrow">Canadian Charter of Rights and Freedoms, 1982</span><h1>The Charter, section by section</h1></div>
   <div class="sheet" style="display:grid;gap:12px">
     <div class="row"><input type="search" id="cs" placeholder="Search: 'lawyer', 'vote', 'jury', 'Royal Proclamation'…" aria-label="Search the Charter" style="flex:1 1 260px"><button class="chip" id="hide" aria-pressed="false">Self-test: hide answers</button></div>
     <div class="row" id="gchips"><button class="chip" data-g="all" aria-pressed="true">All</button>${GROUPS.map(g=>`<button class="chip" data-g="${g[0]}" aria-pressed="false">${g[1]}</button>`).join("")}</div>
     <p class="note">Margin notes on the left are the Charter's own. <span class="tag gold">s. 33</span> marks sections the notwithstanding clause can override.</p>
   </div>
   <div id="secs" class="grid"></div></section>`;
  function draw(){
    const ql=q.toLowerCase();let html="";
    GROUPS.forEach(g=>{
      if(grp!=="all"&&grp!==g[0])return;
      const items=S.filter(s=>s[1]===g[0]&&(!ql||(s.slice(0,6).join(" ")).toLowerCase().includes(ql)));
      if(!items.length)return;
      html+=`<div class="group-h"><h2>${g[1]}</h2><span>${g[2]}</span></div>`;
      items.forEach(s=>{
        const subs=s[3].split("|").map((p,i)=>/^\(/.test(p)?`<span class="sub">${esc(p)}</span>`:`<span>${esc(p)}</span>`).join("");
        html+=`<article class="sec ${hide?"blur":""}" id="sec-${s[0]}"><div class="margin"><span class="num">${s[0]==="35"||s[0]==="52"?"CA "+s[0]:"s. "+s[0]}</span><span class="mnote">${esc(s[2])}</span>${s[7]?`<span><span class="tag gold">s. 33</span></span>`:""}</div>
        <div class="body"><div class="plain"><b>In plain English:</b> ${esc(s[4])}</div>${s[5]?`<div class="hook">Hook: ${esc(s[5])}</div>`:""}
        ${hide?"":`<details><summary>Official text</summary><div class="official" style="margin-top:6px">${subs}</div></details>`}
        ${s[6].length?`<div class="row" style="gap:6px"><span class="note">Cases:</span>${s[6].map(id=>{const c=caseById(id);return c?`<a class="tag plain" href="#cases" data-case="${id}">${esc(c.n)}</a>`:""}).join("")}</div>`:""}</div></article>`;
      });
    });
    $("#secs").innerHTML=html||`<p class="muted">No sections match “${esc(q)}”.</p>`;
    $$("#secs .sec.blur").forEach(a=>a.onclick=e=>{if(e.target.closest("a"))return;a.classList.toggle("show")});
    $$("#secs [data-case]").forEach(a=>a.onclick=()=>{CASEOPEN=a.dataset.case});
  }
  $("#cs").oninput=e=>{q=e.target.value;draw()};
  $("#hide").onclick=e=>{hide=!hide;e.currentTarget.setAttribute("aria-pressed",hide);e.currentTarget.textContent=hide?"Self-test on: tap a section to reveal":"Self-test: hide answers";draw()};
  $$("#gchips .chip").forEach(b=>b.onclick=()=>{grp=b.dataset.g;$$("#gchips .chip").forEach(x=>x.setAttribute("aria-pressed",x===b));draw()});
  draw();
};

function buildDecks(){
  const sub=[];
  S.forEach(s=>{const parts=s[3].split("|");
    if(["2","10","11"].includes(s[0])){parts.slice(1).forEach(p=>{const m=p.match(/^\((\w)\)\s*(.*)$/);if(m)sub.push({id:"sub"+s[0]+m[1],f:`s. ${s[0]}(${m[1]})`,fs:GROUPS.find(g=>g[0]===s[1])[1],b:m[2].replace(/[;,.]?\s*(and|or)?\s*$/,"")})})}

function buildPool(mode,cats){
