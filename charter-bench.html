    if(b.dataset.r===selL){b.classList.add("gone");$(`[data-l="${selL}"]`,g).classList.add("gone");matched++;addXP(4);selL=null;
      if(matched===6){const sec=Math.round((Date.now()-t0)/1000);addXP(miss===0?25:10);$("#mstat").textContent=`Done in ${sec}s · ${miss} miss${miss===1?"":"es"}`;toast(miss===0?"Perfect match! +25 XP":"All matched! +10 XP");return}}
    else{miss++;b.classList.add("shake");setTimeout(()=>b.classList.remove("shake"),340)}
    $("#mstat").textContent=`${matched}/6 · ${miss} miss${miss===1?"":"es"}`;
  });
  g.scrollIntoView({behavior:"smooth",block:"start"});
}

/* ---------- tests ---------- */
V.tests=()=>{
  app.innerHTML=`<section class="view"><div><span class="eyebrow">The frameworks courts use</span><h1>Legal Tests</h1></div>
  <div class="grid g2" style="align-items:start">
   <div class="sheet" style="display:grid;gap:12px"><div><span class="eyebrow">Charter · s. 1</span><h2>The Oakes test</h2><p class="muted">R v Oakes (1986). Government must prove each step on a balance of probabilities. Fail any step = not justified.</p></div>
    <div class="flow">
     <div class="fstep"><span class="n">0</span><div><b>Is there a Charter breach?</b> Claimant proves it. <span class="note">(The Charter only applies to government, s. 32.)</span></div></div>
     <div class="fstep"><span class="n">A</span><div><b>Prescribed by law?</b> Clear, accessible law, not an official's whim.<div class="fail">No → not justified</div></div></div>
     <div class="fstep"><span class="n">1</span><div><b>Pressing &amp; substantial objective?</b> Is the goal important to society? Rarely fails (Vriend did).<div class="fail">No → not justified</div></div></div>
     <div class="fstep"><span class="n">2</span><div><b>Proportionality</b>: are the means reasonable?</div></div>
     <div class="fstep sub"><span class="n">2a</span><div><b>Rational connection.</b> Logically linked to the goal, not arbitrary. <span class="note">Oakes failed here.</span></div></div>
     <div class="fstep sub"><span class="n">2b</span><div><b>Minimal impairment.</b> Limits the right as little as reasonably possible. <span class="note">Most common failure (Zundel). Courts may defer when balancing competing rights.</span></div></div>
     <div class="fstep sub"><span class="n">2c</span><div><b>Proportionate effects.</b> Benefits outweigh the harm to the right. <span class="note">e.g., defamatory libel law (Criminal Code s. 300).</span></div></div>
    </div>
    <p class="callout"><b>Memory trick:</b> "Laws Pass Real Muster Properly" = prescribed by Law, Pressing, Rational, Minimal, Proportionate.</p>
   </div>
   <div style="display:grid;gap:14px">
    <div class="sheet" style="display:grid;gap:10px"><span class="eyebrow">Your class's simplified version</span><h2>The Acorn test</h2>
      <ol class="steps"><li><b>Why?</b> What is the purpose of the limit? <span class="note">(pressing &amp; substantial)</span></li><li><b>Will it work?</b> Is it effective at its purpose? <span class="note">(rational connection)</span></li><li><b>What else might it do?</b> Side effects and unintended consequences? <span class="note">(minimal impairment + proportionate effects)</span></li></ol></div>
    <div class="sheet" style="display:grid;gap:10px"><span class="eyebrow">What happens next</span><h2>Remedies</h2>
      <div class="tscroll"><table><tr><th>Remedy</th><th>What it does</th><th>Example</th></tr>
       <tr><td>Strike down</td><td>Law is of no force or effect (s. 52)</td><td>Bissonnette, Oakes</td></tr>
       <tr><td>Partial invalidity</td><td>Only the bad provision goes</td><td>Criminal Code sections</td></tr>
       <tr><td>Reading down</td><td>Interpret narrowly to fit the Charter</td><td>Butler</td></tr>
       <tr><td>Reading in</td><td>Add words to an under-inclusive law</td><td>Vriend</td></tr>
       <tr><td>Constitutional exemption</td><td>Law stands; one person exempt (rare)</td><td>Taylor at trial</td></tr>
       <tr><td>Suspended invalidity</td><td>Invalid later; time to rewrite</td><td>Carter (12 months)</td></tr>
       <tr><td>s. 24(1)</td><td>Any 'appropriate and just' remedy for a person</td><td>Damages, stays</td></tr>
       <tr><td>s. 24(2)</td><td>Exclude evidence if admitting it brings justice into disrepute</td><td>Illegal searches</td></tr></table></div>
      <p class="note">Government response: redraft the law, or invoke s. 33 for ss. 2 and 7–15.</p></div>
   </div>
  </div>

  <div class="grid g2" style="align-items:start">
   <div class="sheet" style="display:grid;gap:10px"><span class="eyebrow">Notwithstanding clause</span><h2>s. 33 rules</h2>
    <ul class="clean"><li><span class="tag">Can override</span> s. 2 (fundamental freedoms) and ss. 7–15 (legal and equality rights)</li>
    <li><span class="tag plain">Cannot override</span> ss. 3–5 democratic, s. 6 mobility, ss. 16–23 language, s. 28 sex equality, s. 35 Aboriginal rights</li>
    <li><span class="tag gold">Sunset</span> Expires after 5 years; can be re-enacted (s. 33(3)–(5))</li>
    <li><span class="tag plain">Must be express</span> The law has to say it operates 'notwithstanding' the Charter</li></ul>
    <p class="note">Used rarely and mostly by provinces, with Quebec using it most. Your slides raise the open question of whether courts should be able to review or limit its use: does that strengthen or weaken checks and balances?</p></div>
   <div class="sheet" style="display:grid;gap:10px"><span class="eyebrow">Indigenous rights · s. 35</span><h2>The Sparrow test</h2>
    <p class="muted">R v Sparrow (1990). Used because s. 35 is outside the Charter (no s. 1, no s. 33). Applies to federal and provincial laws (Côté), treaty rights, Métis rights and title.</p>
    <div class="flow">
     <div class="fstep"><span class="n">1</span><div><b>Claimant:</b> an existing Aboriginal or treaty right + a prima facie infringement (the law unnecessarily interferes with exercising it).</div></div>
     <div class="fstep"><span class="n">2a</span><div><b>Crown: valid objective</b> that is compelling &amp; substantial (conservation, resource management, public safety). <span class="fail">'Public interest' is too vague.</span></div></div>
     <div class="fstep"><span class="n">2b</span><div><b>Crown: honour of the Crown / fiduciary duty.</b> Priority for the Aboriginal right? As little infringement as possible? Fair compensation? Consultation?</div></div>
     <div class="fstep"><span class="n">→</span><div>Justified → law applies. Not justified → law is of no force or effect <i>as it relates to that group</i>.</div></div>
    </div></div>
  </div>

  <div class="grid g2" style="align-items:start">
   <div class="sheet" style="display:grid;gap:10px"><span class="eyebrow">Métis rights · R v Powley (2003)</span><h2>Powley: proving a Métis right</h2>
    <p class="callout"><b>Your reading's key point:</b> the Court set no strict test for who is Métis, but gave three general requirements: <b>self-identification, ancestral connection, community acceptance</b>. Rights are <b>site-specific</b> (here, hunting for food around Sault Ste. Marie).</p>
    <p class="muted">The full framework the courts use to prove the right itself has 10 steps:</p>
    <ol class="steps"><li>Characterize the right (e.g., hunting for food)</li><li>Identify the historic rights-bearing Métis community</li><li>Identify the contemporary rights-bearing community</li><li>Verify the claimant's membership: <b>self-identification, ancestral connection, community acceptance</b></li><li>Identify the relevant time: before Europeans gained effective political and legal control</li><li>Was the practice integral to the community's distinctive culture?</li><li>Continuity between the historic practice and today's right</li><li>Was the right extinguished?</li><li>If not, is there an infringement?</li><li>Is the infringement justified (Sparrow)?</li></ol></div>
   <div style="display:grid;gap:14px">
    <div class="sheet" style="display:grid;gap:8px"><span class="eyebrow">Aboriginal rights · Van der Peet (1996)</span><h3>Integral to a distinctive culture</h3><p>The practice must be <b>central</b> to the society and have existed <b>before European contact</b>. Can be exercised in a modern way.</p></div>
    <div class="sheet" style="display:grid;gap:8px"><span class="eyebrow">Aboriginal title · Delgamuukw (1997), Tsilhqot'in (2014)</span><h3>Occupation · Continuity · Exclusivity</h3><p>Measured at the time the Crown asserted sovereignty. Oral histories count as evidence. On titled land the Crown needs consent or must justify.</p></div>
    <div class="sheet" style="display:grid;gap:8px"><span class="eyebrow">Charter s. 25 · Dickson (2024)</span><h3>The four-step s. 25 framework</h3>
     <ol class="steps"><li>Charter claimant shows a prima facie breach</li><li>Party relying on s. 25 shows the right is within its scope (protects Indigenous difference)</li><li>That party proves an <b>irreconcilable conflict</b>; if so, s. 25 shields the Indigenous right</li><li>Courts check any other limits on the s. 25 right</li></ol></div>
   </div>
  </div>

  <div class="sheet" style="display:grid;gap:12px"><span class="eyebrow">Likely test theme</span><h2>When rights collide</h2>
   <p class="serif" style="max-width:70ch">Charter rights have no ranking. When they conflict, courts look at context and balance them, usually through s. 1 / Oakes, or through proportionate balancing (Doré) when the decision-maker is an agency like a law society.</p>
   <div class="tscroll"><table><tr><th>Case</th><th>Right A</th><th>Right / interest B</th><th>How it was resolved</th></tr>
    <tr><td>TWU (2018)</td><td>Religion, 2(a)</td><td>LGBTQ equality, diversity in the profession</td><td>Limit on religion minor; refusing accreditation reasonable</td></tr>
    <tr><td>A.C. (2009)</td><td>Teen's religion and autonomy, 2(a), 7</td><td>State protecting life and health</td><td>'Best interests' weighs maturity; law upheld 6–1</td></tr>
    <tr><td>Keegstra (1990)</td><td>Expression, 2(b)</td><td>Equality and multiculturalism, 15, 27</td><td>Hate-promotion law justified under s. 1</td></tr>
    <tr><td>Carter (2015)</td><td>Autonomy, 7</td><td>Protecting vulnerable people</td><td>Blanket ban overbroad; struck down</td></tr>
    <tr><td>Dickson (2024)</td><td>Individual equality, 15</td><td>Collective Indigenous self-government</td><td>s. 25 shields the collective right</td></tr>
    <tr><td>Kapp (2008)</td><td>Equality of non-Aboriginal fishers</td><td>Communal Aboriginal fishery</td><td>Upheld as an ameliorative program, s. 15(2)</td></tr></table></div></div>
  </section>`;
};

/* ---------- indigenous ---------- */
V.indigenous=()=>{
  const tl=[["1760–61","Peace and Friendship treaties with the Mi'kmaq (Marshall)."],["1763","Royal Proclamation (Oct 7) makes protecting Indigenous lands Crown policy; basis for treaties."],["1876","Indian Act lets Canada control most aspects of First Nations life."],["1928–1942","Stoney Point shoreline surrendered (1928); Ipperwash Park created (1936); reserve taken for Camp Ipperwash (WWII)."],["1960","Canadian Bill of Rights. Status Indians get the federal vote."],["1969","Trudeau government's White Paper proposes ending Indian status; strong opposition."],["1970","Drybones: Bill of Rights strikes an Indian Act offence."],["1973","Calder: Aboriginal title exists in Canadian law. Lavell upholds sex discrimination in the Indian Act."],["1980–81","Constitution Express campaign wins inclusion of Aboriginal rights."],["1982","s. 35 and s. 25 in the Constitution Act, 1982."],["1983","s. 35(3) and (4) added after lobbying by Indigenous women."],["1985","Bill C-31 ends loss of status for women who 'married out'."],["1990","Sparrow: first SCC interpretation of s. 35. Oka crisis."],["1995","Ipperwash: Dudley George killed (Sept 6–7)."],["1996","Van der Peet test. Royal Commission on Aboriginal Peoples reports."],["1997","Delgamuukw: oral histories; Aboriginal title is constitutional."],["1999","Marshall: moderate livelihood. Corbiere."],["2000","Nisga'a Final Agreement, BC's first modern treaty."],["2003","Powley: first Métis s. 35 right."],["2007","Ipperwash Inquiry report (May 31). UN adopts UNDRIP."],["2014","Tsilhqot'in: first declaration of title. Grassy Narrows."],["2016","Daniels: Métis and non-status Indians are 'Indians' under s. 91(24). Canada fully endorses UNDRIP."],["2017","Clyde River: duty to consult Inuit."],["2024","Dickson: modern s. 25 framework."]];
  app.innerHTML=`<section class="view"><div><span class="eyebrow">Constitution Act, 1982 · s. 35 &amp; Charter s. 25</span><h1>Indigenous Rights</h1></div>
  <div class="sheet" style="display:grid;gap:12px"><span class="eyebrow">From "Indigenous Rights in One Minute" · on your review sheet</span><h2>Why each decision is important</h2>
   <div class="grid g3" style="align-items:start">
    <div style="display:grid;gap:6px"><h3>Sparrow (1990)</h3><p class="callout">The Supreme Court's <b>first confirmation of an Aboriginal right under s. 35</b>.</p>
     <ul class="clean" style="font-size:14.5px"><li>1984: Ron Sparrow (Musqueam) charged for fishing in the Fraser River with a net longer than allowed.</li><li>s. 35 = <b>limited</b> protection from regulation; rights aren't absolute.</li><li>Only rights existing in 1982 are protected. Regulation before 1982 ≠ extinguishment; that needs the Crown's <b>clear and plain intent</b>.</li><li>Musqueam won a <b>food, social and ceremonial</b> fishery, subject to conservation, with <b>priority</b> over other fisheries.</li><li>Rejected: fishing right = non-Indigenous property right. Accepted without question: the <b>Doctrine of Discovery</b> (Crown sovereignty and underlying title).</li><li>Result: the federal <b>Aboriginal Fisheries Strategy</b>.</li></ul></div>
    <div style="display:grid;gap:6px"><h3>Powley (2003)</h3><p class="callout">Set the <b>test for recognizing Métis rights</b> under s. 35.</p>
     <ul class="clean" style="font-size:14.5px"><li>Fall 1993: Steve and Roddy Powley shot a moose north of Sault Ste. Marie; charged for hunting without a licence.</li><li>First time the SCC decided how to identify Métis for s. 35.</li><li>'Métis' ≠ everyone of mixed ancestry. It means people whose ancestors had a <b>distinct collective identity</b> in a specific area before European control.</li><li>Three requirements: <b>self-identification, ancestral connection, community acceptance</b>.</li><li>Rights are <b>site-specific</b>, not free-floating.</li><li>Hard for others: must prove a historic Métis community existed <b>100+ years ago in that exact place</b>, and that their ancestors were in it.</li></ul></div>
    <div style="display:grid;gap:6px"><h3>Marshall I &amp; II (1999)</h3><p class="callout">Recognized a <b>Mi'kmaq treaty right to a commercial fishery</b>.</p>
     <ul class="clean" style="font-size:14.5px"><li>Summer 1993: after 12 years wrongly imprisoned for murder, Donald Marshall Jr. sold 463 lbs of eels caught near Pomquet Harbour, NS.</li><li>Peace and Friendship Treaty, Halifax, <b>March 10, 1760</b>, Gov. Charles Lawrence. Mi'kmaq promised to not help the French, not attack the British, release prisoners, and trade only at <b>truck houses</b>.</li><li>Principle: <b>unconscionable</b> for the Crown to rely on written terms while ignoring oral terms.</li><li>Limited to a <b>moderate livelihood</b>: food, clothing, housing, a few amenities, not wealth.</li><li><b>Marshall II:</b> after a fall 1999 backlash by non-Indigenous fishers, a second set of reasons confirmed Ottawa can regulate the fishery.</li><li>25+ years later the Mi'kmaq are still fighting for it (see <a href="#films">Trapped on the Water</a>).</li></ul></div>
   </div></div>
  <div class="grid g2" style="align-items:start">
   <div class="sheet" style="display:grid;gap:10px"><h2>s. 35 vs s. 25</h2>
    <div class="tscroll"><table><tr><th></th><th>s. 35 (CA 1982)</th><th>s. 25 (Charter)</th></tr>
     <tr><td>Where</td><td>Part II, outside the Charter</td><td>Inside the Charter</td></tr>
     <tr><td>What it does</td><td>Recognizes and affirms existing Aboriginal and treaty rights</td><td>Stops other Charter rights from abrogating or derogating from Indigenous rights</td></tr>
     <tr><td>Nickname</td><td>The rights themselves</td><td>The 'shield' (not a sword)</td></tr>
     <tr><td>Limits</td><td>Sparrow test (no s. 1, no s. 33)</td><td>Dickson 4-step test</td></tr>
     <tr><td>Covers</td><td>Indian (First Nations), Inuit, Métis</td><td>Aboriginal, treaty or 'other' rights, incl. Royal Proclamation 1763 and land claims; broader than s. 35 (Corbiere)</td></tr></table></div>
    <p class="callout">s. 35 <b>recognizes</b> rights; it did not <b>create</b> them. Aboriginal rights existed before 1982.</p></div>
   <div class="sheet" style="display:grid;gap:10px"><h2>Three kinds of rights</h2>
    <dl style="margin:0;display:grid;gap:10px">
     <div><dt><span class="tag">Aboriginal rights</span></dt><dd class="serif" style="margin:4px 0 0">Inherent, collective rights from occupying the land before Europeans: practices integral to a distinctive culture (hunting, fishing, ceremonies). Van der Peet.</dd></div>
     <div><dt><span class="tag">Treaty rights</span></dt><dd class="serif" style="margin:4px 0 0">Come from agreements between the Crown and a nation, historic or modern land claims. Read generously, with oral terms and context, never 'frozen' (Marshall).</dd></div>
     <div><dt><span class="tag">Aboriginal title</span></dt><dd class="serif" style="margin:4px 0 0">A collective right to the land itself. Occupation, continuity, exclusivity (Tsilhqot'in). 'Usufructuary': a right to use land the Crown technically owns. Can only be surrendered to the Crown.</dd></div>
    </dl>
    <p class="note">Sources of rights Indigenous groups rely on: international law (UNDRIP), the Royal Proclamation and treaties, and common law from Canadian courts.</p></div>
  </div>
  <div class="grid g3">
   <div class="sheet" style="display:grid;gap:8px;align-content:start"><span class="eyebrow">Duty to consult</span><h3>Before decisions affecting rights</h3><p>Grows out of the honour of the Crown. Affirmed in Delgamuukw; provinces taking up treaty land must consult (Grassy Narrows, 2014); the NEB failed to consult Inuit in Clyde River (2017). After Tsilhqot'in the Crown may need consent on titled land.</p></div>
   <div class="sheet" style="display:grid;gap:8px;align-content:start"><span class="eyebrow">Indian Act &amp; status</span><h3>Status vs non-status</h3><p>The Indian Act (1876) created status categories that divided communities and banned potlatches and dances. Before 1985, women who married non-status men lost status. Bill C-31 (1985) fixed this but added a second-generation cut-off. Daniels (2016) did NOT grant status.</p></div>
   <div class="sheet" style="display:grid;gap:8px;align-content:start"><span class="eyebrow">Inuit &amp; Métis</span><h3>Who's covered</h3><p>Inuit were never under the Indian Act but were ruled a federal responsibility in 1939. Métis rights were confirmed by Powley; Métis identity is tied to a specific historic community, not just mixed ancestry. Daniels: Métis and non-status Indians fall under s. 91(24) of the Constitution Act, 1867.</p></div>
  </div>
  <div class="sheet" style="display:grid;gap:12px"><span class="eyebrow">Landmark case · OJEN</span><h2>Ipperwash, in brief</h2>
   <div class="grid g2"><div class="serif" style="display:grid;gap:8px;font-size:15.5px;align-content:start"><p>Chippewas of Kettle and Stony Point land: the shoreline was surrendered in 1928 under questionable circumstances, became a provincial park in 1936 despite a known burial site, and the Stoney Point reserve was taken for an army camp in WWII with a promise to return it. It wasn't.</p><p>On Sept 4, 1995 occupiers entered Ipperwash Provincial Park. The Harris government wanted it ended fast and treated it as law enforcement, not Aboriginal rights. Poor communication and unverified reports of gunfire escalated things. On the night of Sept 6, Sgt. Ken Deane shot Dudley George, who died early Sept 7. The Inquiry found he had no gun.</p></div>
   <div><b>Inquiry facts</b><ul class="clean" style="margin-top:6px;font-size:14.5px"><li>Called by Ontario in 2003; Commissioner Justice Sidney Linden</li><li>Hearings July 2004 to Aug 2006; 139 witnesses in Part 1</li><li>Report May 31, 2007: 4 volumes, 100 recommendations; cost $13.3M</li><li>Recs: Treaty Commission of Ontario; consult and accommodate on resources; protect burial sites; public education; police sensitivity and peacekeeping; separate government and police roles; First Nations policing; Ministry of Aboriginal Affairs; Reconciliation Fund</li></ul></div></div></div>
  <div class="sheet" style="display:grid;gap:12px"><span class="eyebrow">Your organizer · on the review sheet</span><h2>Indigenous Peoples in Canadian Law</h2>
   <div class="grid g3" style="align-items:start;font-size:14.5px">
    <div><h3>Indigenous status</h3><p>s. 35 names Indian, Inuit and Métis. A bloodline rule for reserve land began in Lower Canada in 1850. Since the 1985 Indian Act changes, status is <b>neither gained nor lost through marriage</b>, and bands can pass residency bylaws. Inuit fall under federal power but there's no 'Inuit Act'. Métis has had several definitions (population estimates range from 100,000 to one million); Daniels (2016) put Métis and non-status Indians under federal jurisdiction.</p></div>
    <div><h3>Land rights</h3><p>Parliament controls 'lands reserved for the Indians'. Once land is surrendered it becomes provincial Crown land. Indigenous land rights are <b>usufructuary</b> (a right to use land the Crown technically owns) and <b>communal</b>: they belong to the group and can only be given up to the Crown.</p></div>
    <div><h3>Laws of general application</h3><p>Indigenous people follow the general law unless a treaty or special protection applies. Under <b>s. 88 of the Indian Act</b> the term means <b>provincial</b> laws. s. 35 protects rights from federal and provincial laws, but Sparrow lets laws regulate them if justified (conservation, public safety).</p></div>
    <div><h3>Hunting &amp; fishing</h3><p>Where no treaty covers it, s. 35 protects harvesting. The <b>Constitution Act, 1930</b> guaranteed Prairie First Nations hunting and fishing for food on unoccupied Crown land, free of provincial rules. Commercial rights: affirmed in Agawa (1988) and Jones (1993), but Horseman (1990) held Prairie commercial rights were extinguished by the 1930 Act.</p></div>
    <div><h3>Legal status of communities</h3><p>A band's legal status is unclear (it may not be able to sue or be sued in its own name). Incorporating solves this but can cost Indian Act tax exemptions. Bands have limited Indian Act powers; self-government aims to expand them.</p></div>
    <div><h3>Customary practices</h3><p>Courts recognize <b>customary marriage</b> (but not customary divorce) and <b>customary adoption</b>. Band leaders chosen by custom can act as chief and council. Corbiere: off-reserve members' voting rights. The Charter (s. 22) protects customary language rights, which may cover Indigenous languages.</p></div>
    <div><h3>Taxation</h3><p>The Indian Act exempts reserve land and on-reserve personal property. <b>Williams (1992)</b>: income sufficiently connected to a reserve is tax-free. No customs exemption despite Jay's Treaty (1794): <b>Francis (1956)</b> said it wasn't an Indigenous treaty and had no legislative force in Canada. The Nisga'a agreed to phase out some tax exemptions.</p></div>
    <div><h3>Equality before the law</h3><p>Majority rule can overlook minority rights. <b>Drybones</b> used the 1960 Bill of Rights to strike an Indian Act offence (intoxicated off-reserve). <b>Lavell (1973)</b> refused to strike sex discrimination in the Act, a widely criticized decision. Charter s. 25 stops equality rights from diminishing Royal Proclamation rights.</p></div>
    <div><h3>Indigenous justice systems</h3><p>RCAP noted historic discrimination and over-incarceration of Indigenous people and recommended Indigenous justice systems. Diversion and sentencing circles are now used. Akwesasne (Mohawk) launched its own court law on Oct 2, 2016; Thunder Bay approved an Indigenous People's Court on Nov 9, 2016.</p></div>
   </div></div>
  <div class="grid g2" style="align-items:start">
   <div class="sheet" style="display:grid;gap:10px"><h2>Timeline</h2><div class="timeline">${tl.map(([y,t])=>`<div class="tl"><div class="y">${y}</div><div style="font-size:14.5px">${esc(t)}</div></div>`).join("")}</div></div>
   <div class="sheet" style="display:grid;gap:10px"><h2>Debate: does s. 35 work?</h2>
    <div class="grid" style="gap:12px">
     <div><span class="tag plain">Critique</span> <b>Lee Maracle</b> (Stó:lō): s. 35 reinforces colonialism by treating Canadian law as supreme instead of nation-to-nation.</div>
     <div><span class="tag plain">Critique</span> <b>Mary-Ellen Turpel</b>: accepting the Constitution means adjusting everything to fit a Western system of individual rights and private property.</div>
     <div><span class="tag plain">Critique</span> Many Indigenous people still get charged for exercising rights; s. 35 is 'powerful yet invisible' in daily life.</div>
     <div><span class="tag okt">Support</span> <b>John Borrows</b> (Nawash): s. 35 gives institutional means to resist violations, might have changed Calder's outcome, and puts rights 'squarely in the public eye'.</div>
    </div>
    <p class="callout">Good essay move: show both sides, then use a case (Sparrow upheld rights; other cases allowed infringement) to support your view.</p>
    <h3 style="margin-top:6px">Self-government</h3><p style="font-size:14.5px">Not directly decided by the SCC. RCAP (1996) recommended recognizing it. The Nisga'a Final Agreement (2000) gave self-government over 2,019 km² in the Nass Valley. Indigenous justice: sentencing circles; Akwesasne court (2016); Indigenous People's Court in Thunder Bay (2016).</p></div>
  </div></section>`;
};

/* ---------- human rights ---------- */
V["human-rights"]=()=>{
  const map=[["1","Free and equal in dignity","15"],["2","Non-discrimination","15"],["3","Life, liberty, security","7"],["5","No torture or cruel punishment","12"],["7","Equal before the law","15"],["9","No arbitrary arrest","9, 10"],["10","Fair hearing, impartial tribunal","11(d)"],["11","Presumed innocent; no retroactive crimes","11(d), 11(g)"],["12","Privacy","8"],["13","Movement; leave and return","6"],["18","Thought, conscience, religion","2(a)"],["19","Opinion and expression","2(b)"],["20","Assembly and association","2(c), 2(d)"],["21","Free elections","3"],["29","Rights limited by law for others' rights","1"],["24","Rest and leisure","No match"],["25","Adequate standard of living","No match"]];
  app.innerHTML=`<section class="view"><div><span class="eyebrow">Constitutional &amp; human rights in Canada</span><h1>Human Rights</h1></div>
  <div class="grid g2" style="align-items:start">
   <div class="sheet" style="display:grid;gap:10px"><h2>Natural vs positive rights</h2>
    <div class="tscroll"><table><tr><th>Natural rights</th><th>Positive rights</th></tr><tr><td>Belong to everyone just for being human</td><td>Created by law and tied to society's well-being</td></tr><tr><td>Universal and absolute (non-restrictable)</td><td>Restrictable: can be limited</td></tr><tr><td>Natural law philosophy</td><td>Positive law philosophy</td></tr></table></div>
    <p class="callout">Which does Canada follow? The Charter speaks of guaranteed rights but s. 1 allows reasonable limits, so in practice Canada treats rights as restrictable.</p>
    <h3>Three definitions of human rights</h3><ul class="clean" style="font-size:14.5px"><li>Liberties of a free society plus a fair share of what society offers (food, shelter, jobs, education)</li><li>A right that justifiably belongs to every person</li><li>Inherent dignity and equal, inalienable rights of all members of the human family (UDHR preamble)</li></ul></div>
   <div class="sheet" style="display:grid;gap:10px"><h2>Bill of Rights vs Charter</h2>
    <div class="tscroll"><table><tr><th></th><th>Canadian Bill of Rights</th><th>Charter</th></tr><tr><td>Date</td><td>Aug 10, 1960 (Diefenbaker)</td><td>April 17, 1982 (patriation)</td></tr><tr><td>Type</td><td>Ordinary federal statute</td><td>Entrenched in the Constitution</td></tr><tr><td>Applies to</td><td>Federal law only</td><td>Federal and provincial governments</td></tr><tr><td>Can be changed by</td><td>Parliament, like any law</td><td>Constitutional amendment only</td></tr><tr><td>Courts</td><td>Reluctant to apply it (Lavell); Drybones an exception</td><td>Strike laws down under s. 52</td></tr></table></div></div>
  </div>
  <div class="sheet" style="display:grid;gap:12px"><h2>Who protects your rights? Pick the right tool.</h2>
   <div class="grid g2">
    <div><span class="tag">1 · Charter</span><p style="margin-top:6px">Government laws and actions only (s. 32). Federal and provincial.</p></div>
    <div><span class="tag">2 · Canadian Human Rights Act (1978)</span><p style="margin-top:6px">Federally regulated employers and services: CBC, armed forces, Parks Canada, Canada Post, banks, airlines.</p></div>
    <div><span class="tag">3 · Provincial human rights codes</span><p style="margin-top:6px">e.g., Ontario Human Rights Code. Private employers, landlords and businesses. More specific than the federal Act.</p></div>
    <div><span class="tag">4 · Commissions &amp; tribunals</span><p style="margin-top:6px">Investigate complaints and try to settle; if not, a formal hearing (e.g., Human Rights Tribunal of Ontario). Balance of probabilities; looser evidence rules. Respondent must show a bona fide reason and undue hardship.</p></div>
   </div>
   <p class="callout"><b>Turnbull v Famous Players (2001):</b> a theatre with no wheelchair access is a private business, so the human rights code applies, not the Charter.</p></div>
  <div class="grid g2" style="align-items:start">
   <div class="sheet" style="display:grid;gap:10px"><span class="eyebrow">On the review sheet</span><h2>Ontario Human Rights Code (1962)</h2>
    <p>Canada's <b>first</b> human rights code, 20 years before the Charter. It applies to <b>private and public</b> actors in Ontario, filling the gap left by s. 32.</p>
    <div class="tscroll"><table><tr><th>Protects you in</th><th>Example</th></tr><tr><td>Employment</td><td>Hiring, firing, harassment at work</td></tr><tr><td>Housing</td><td>Renting an apartment</td></tr><tr><td>Goods, services &amp; facilities</td><td>Stores, restaurants, theatres (Turnbull), schools</td></tr><tr><td>Contracts</td><td>Signing an agreement</td></tr><tr><td>Unions &amp; professional associations</td><td>Membership</td></tr></table></div>
    <p style="font-size:14.5px">Grounds include race, ancestry, place of origin, colour, ethnic origin, citizenship, creed, sex, <b>sexual orientation</b>, gender identity and expression, age, marital and family status, and disability.</p>
    <p class="note">The <b>Ontario Human Rights Commission</b> educates and sets policy; the <b>Human Rights Tribunal of Ontario</b> hears and decides complaints. Federal workplaces fall under the Canadian Human Rights Act (1978) instead.</p></div>
   <div class="sheet" style="display:grid;gap:10px"><span class="eyebrow">On the review sheet</span><h2>Systemic racism &amp; police carding</h2>
    <p><b>Systemic racism:</b> policies and practices built into institutions (police, courts, schools, child welfare) that produce worse outcomes for racialized groups, <b>even when no one intends to discriminate</b>. Compare: individual racism is one person's prejudice or act.</p>
    <p><b>Police carding (street checks):</b> police stop people who are not suspected of a specific crime, question them and record their personal information in a database.</p>
    <ul class="clean" style="font-size:14.5px"><li><b>Why it's systemic:</b> Toronto data showed Black and Indigenous people were carded far more often than their share of the population.</li><li><b>Charter issues:</b> s. 9 (arbitrary detention), s. 15 (equality), s. 8 (privacy). Discrimination by police can also go to human rights tribunals.</li><li><b>Response:</b> Ontario restricted arbitrary and race-based carding by regulation from <b>January 1, 2017</b>.</li><li><b>Other examples in this unit:</b> over-incarceration of Indigenous people (organizer, RCAP); the Ipperwash response.</li></ul>
    <p class="note">Film link: <a href="#films">The Skin We're In</a> follows Desmond Cole's own experience of being carded.</p></div>
  </div>
  <div class="grid g2" style="align-items:start">
   <div class="sheet" style="display:grid;gap:10px"><h2>Limits on expression: Keegstra vs Zundel</h2>
    <div class="tscroll"><table><tr><th></th><th>Keegstra (1990)</th><th>Zundel (1992)</th></tr><tr><td>Who</td><td>Alberta teacher teaching antisemitism</td><td>Holocaust-denial pamphlet</td></tr><tr><td>Law</td><td>s. 319: wilfully promoting hatred against an identifiable group</td><td>s. 181: spreading false news causing mischief to a public interest</td></tr><tr><td>2(b) breached?</td><td>Yes</td><td>Yes</td></tr><tr><td>Saved by s. 1?</td><td><b>Yes</b>: targeted; protects equality and multiculturalism</td><td><b>No</b>: far too broad, could catch almost anything</td></tr></table></div>
    <p class="note">The difference is minimal impairment: a narrow law survives; a sweeping one doesn't.</p></div>
   <div class="sheet" style="display:grid;gap:10px"><h2>Legal discrimination in Canada</h2>
    <ul class="clean" style="font-size:14.5px"><li><b>War Measures Act:</b> about 8,600 people interned as 'enemy aliens' (Ukrainian and Austro-Hungarian); about 22,000 Japanese Canadians uprooted and interned or deported in WWII, their property sold</li><li><b>Indian Act (1876):</b> government control over most aspects of First Nations life</li><li><b>Chinese Exclusion Act (1923–1947):</b> banned nearly all Chinese immigration</li><li><b>Police carding:</b> ongoing; disproportionately affects Black and Indigenous people</li></ul>
    <p class="flag">Heads-up: your slides place the 8,600 internments in WWII. Historically those camps were in WWI (1914–1920). Japanese Canadian internment was WWII. Check which your teacher wants.</p>
    <h3>Key terms</h3><ul class="clean" style="font-size:14.5px"><li><b>Discrimination</b>: treating someone differently or adversely for no valid reason</li><li><b>Prejudice</b>: an opinion based on irrelevant or inadequate knowledge</li><li><b>Stereotype</b>: judging one member of a group and applying it to all</li></ul></div>
  </div>
  <div class="sheet" style="display:grid;gap:12px"><div><span class="eyebrow">Universal Declaration of Human Rights · UN General Assembly · 1948</span><h2>The UDHR</h2></div>
   <p class="serif" style="max-width:70ch">After roughly 75 million deaths in WWII, the United Nations formed on Oct 24, 1945. One of its first acts was the UDHR (Dec 10, 1948): 30 articles, the first international agreement to promote and protect basic human rights. It's a declaration, not a binding treaty, but it shaped later treaties and Canada's Charter.</p>
   <div class="grid g2" style="align-items:start">
    <div><h3>UDHR ↔ Charter</h3><div class="tscroll" style="margin-top:6px"><table><tr><th>Art.</th><th>Right</th><th>Charter</th></tr>${map.map(m=>`<tr><td class="mono">${m[0]}</td><td>${m[1]}</td><td>${m[2]==="No match"?`<span class="tag plain">No match</span>`:`<span class="tag">s. ${m[2]}</span>`}</td></tr>`).join("")}</table></div>
     <p class="note" style="margin-top:6px">Social and economic rights (Arts. 22–26) have no direct Charter equivalent. Your slides note the UDHR doesn't mention sexual orientation or freedom from poverty, reflecting 1948 values.</p></div>
    <div><h3>All 30 articles</h3><input type="search" id="us" placeholder="Find an article: 'religion', 'asylum'…" aria-label="Search UDHR articles" style="margin-top:6px"><ul class="clean" id="ul" style="margin-top:10px;max-height:420px;overflow:auto;font-size:14.5px"></ul></div>
   </div></div>
  </section>`;
  const drawU=(q="")=>{$("#ul").innerHTML=UDHR.filter(u=>!q||u[1].toLowerCase().includes(q.toLowerCase())||String(u[0])===q.trim()).map(u=>`<li><span class="tag plain">Art. ${u[0]}</span> ${esc(u[1])}</li>`).join("")};
  $("#us").oninput=e=>drawU(e.target.value);drawU();
};

function route(){

  $$("#nav a").forEach(a=>{if(a.getAttribute("href")==="#"+h)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});

  const act=$('#nav a[aria-current="page"]');if(act&&act.parentElement.scrollWidth>act.parentElement.clientWidth)act.parentElement.scrollLeft=act.offsetLeft-16;
